name: Hydra
options:
  bundleIdPrefix: com.hydra
  deploymentTarget:
    iOS: "17.0"
packages:
  TerminalCore:
    path: Packages/TerminalCore
  SwiftTerm:
    path: Packages/SwiftTerm
targets:
  TerminalInputUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HydraiOSUITests
    dependencies:
      - target: HydraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s1ckdark.hydraios.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
  TerminalInputTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/SwiftTerm/Tests/SwiftTermInputTests
      - path: HydraiOSInputTests
    dependencies:
      - target: HydraiOS
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
  HydraiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HydraiOS
      - path: Hydra/Models
      - path: Hydra/State
      - path: Hydra/ViewModels
      - path: Hydra/Theme
      - path: Hydra/Services
        excludes:
          - "PYExecutor.swift"        # subprocess — macOS only
          - "EmbeddedServer.swift"    # embedded hydra-server — macOS only
          - "MetricsSampler.swift"    # host metric sampling — macOS only
          - "CapabilityReporter.swift" # host GPU capability — macOS only
          - "ChatContextProvider.swift" # references DashboardViewModel (ViewModels/ — B2b)
          - "MetricsReporter.swift"    # entirely depends on MetricsSampler — macOS host metrics only
    dependencies:
      - package: TerminalCore
        product: SSHTransportCitadel
      - package: TerminalCore
        product: SSHTransport
      - package: TerminalCore
        product: KnownHosts
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s1ckdark.hydraios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
schemes:
  HydraiOS:
    build:
      targets:
        HydraiOS: all
    run:
      config: Debug
  TerminalInputTests:
    build:
      targets:
        HydraiOS: all
        TerminalInputTests: [test]
    test:
      targets:
        - TerminalInputTests
  TerminalInputUITests:
    build:
      targets:
        HydraiOS: all
        TerminalInputUITests: [test]
    test:
      targets:
        - TerminalInputUITests
  TerminalInputValidation:
    build:
      targets:
        HydraiOS: all
        TerminalInputTests: [test]
        TerminalInputUITests: [test]
    test:
      targets:
        - TerminalInputTests
        - TerminalInputUITests
